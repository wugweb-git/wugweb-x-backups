# Keeps the free-plan Supabase project from pausing (it pauses after ~7 days without activity).
name: keepalive
on:
  schedule:
    - cron: '17 3 */3 * *'   # every 3 days, 03:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -tAc "select now(), count(*) from core.tenants"
